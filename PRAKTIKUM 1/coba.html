<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <title>Contoh Tabel Sederhana</title>
</head>
<body>
  <table border="1" cellpadding="8" cellspacing="0" summary="Contoh tabel produk">
    <caption><strong>Daftar Produk</strong></caption>

    <colgroup>
      <col style="width: 10%">
      <col style="width: 45%">
      <col style="width: 20%">
      <col style="width: 25%">
    </colgroup>

    <thead>
      <tr>
        <th scope="col">No</th>
        <th scope="col">Nama Produk</th>
        <th scope="col">Stok</th>
        <th scope="col">Harga</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <th scope="row">1</th>
        <td>Notebook A5</td>
        <td>25</td>
        <td>Rp 25.000</td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Stylus Pen</td>
        <td>40</td>
        <td>Rp 45.000</td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td>Mouse Wireless</td>
        <td>12</td>
        <td>Rp 125.000</td>
      </tr>
    </tbody>

    <tfoot>
      <tr>
        <td colspan="3"><strong>Total Item</strong></td>
        <td>77</td>
      </tr>
    </tfoot>
  </table>
</body>
</html>
