name: Deploy Praktikum-4
on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Pages
        uses: actions/configure-pages@v2
      - name: Upload Praktikum-4
        uses: actions/upload-pages-artifact@v1
        with:
          path: 'Praktikum-4'
      - name: Deploy
        uses: actions/deploy-pages@v1