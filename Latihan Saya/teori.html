<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .container {
            width: 100%;
            height: 60px;
            background-color: #333;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
        }
        .header {
            display: flex;
            align-items: center;
            width: 100%;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #555;
            border-radius: 50%;
            margin-right: 20px;
        }
        .menu-item {
            margin-right: 20px;
            cursor: pointer;
        }
        .spacer {
            flex-grow: 1;
        }
        input[type="search"] {
            padding: 5px;
            border-radius: 5px;
            border: none;
        }
        .main-containt {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar"></div>
            <div class="menu-item">Profile</div>
            <div class="menu-item">Home</div>
            <div class="menu-item">Settings</div>
            <div class="menu-item">Logout</div>
            <div class="spacer"></div>
            <input type="search" placeholder="Search..." class="search-input">
        </div>
    </div>
    <div class="main-containt">
        <div style="display: flex; gap: 40px;"></div>
            <div class="left-side" style="flex: 1; background: #f5f6fa; border-radius: 16px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);"></div>
                <h1 style="color: #2d3436; margin-bottom: 12px;">Product Name</h1>
                <p style="color: #636e72;">Description of the product goes here.</p>
                <button style="margin-top: 24px; background: #0984e3; color: white; border: none; padding: 12px 32px; border-radius: 8px; font-size: 16px; cursor: pointer; box-shadow: 0 2px 4px rgba(9,132,227,0.08); transition: background 0.2s;">Buy Now</button>
            </div>
            <div style="flex: 1; background: #dfe6e9; border-radius: 16px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column; justify-content: center; align-items: center;">
                <h2 style="color: #00b894; margin-bottom: 16px;">Special Offer!</h2>
                <p style="color: #636e72;">Get 20% off your first purchase.</p>
            </div>
        </div>
    </div>
    <div style="text-align: center; margin-top: 40px;">
        <h1 style="color: #0984e3;">Welcome to My HTML Document</h1>
        <p style="color: #636e72;">This is a basic HTML document structure.</p>
    </div>
    <style>
        .container {
            background: linear-gradient(90deg, #0984e3 0%, #00b894 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .header {
            gap: 16px;
        }
        .avatar {
            background: linear-gradient(135deg, #00b894 0%, #0984e3 100%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border: 2px solid #fff;
        }
        .menu-item {
            background: #fff;
            color: #0984e3;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
        }
        .menu-item:hover {
            background: #0984e3;
            color: #fff;
        }
        .search-input {
            padding: 8px 16px;
            border-radius: 8px;
            border: none;
            background: #fff;
            color: #636e72;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            outline: none;
            transition: box-shadow 0.2s;
        }
        .search-input:focus {
            box-shadow: 0 2px 12px rgba(9,132,227,0.12);
        }
        body {
            background: #f1f2f6;
        }
    </style>
</body>
</html>
